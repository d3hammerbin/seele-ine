# =============================================================================
# SEELE-E - Sistema de Extracción de Información de Credenciales INE
# Docker Compose Configuration
# =============================================================================

services:
  # =============================================================================
  # BASE DE DATOS POSTGRESQL
  # =============================================================================
  postgres:
    image: postgres:17.0-alpine
    container_name: seele_ine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TIMEZONE}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ./backups:/backups
    networks:
      - seele_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # =============================================================================
  # REDIS PARA CACHE Y SESIONES
  # =============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: seele_ine_redis
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - seele_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server /usr/local/etc/redis/redis.conf

  # =============================================================================
  # BACKEND FASTAPI
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${ENVIRONMENT:-development}
    container_name: seele_ine_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
      - TZ=${TIMEZONE}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS}
      - API_KEY_LENGTH=${API_KEY_LENGTH}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - APP_NAME=${APP_NAME}
      - APP_VERSION=${APP_VERSION}
      - BACKEND_HOST=${BACKEND_HOST}
      - BACKEND_PORT=${BACKEND_PORT}
      - CORS_ORIGINS=${CORS_ORIGINS}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./temp:/app/temp
      - ./credentials:/app/credentials
      - ./logs:/app/logs
      - ./scripts:/app/scripts:ro
    networks:
      - seele_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"
            - ".pytest_cache/"
        - action: rebuild
          path: ./backend/requirements.txt

  # =============================================================================
  # FRONTEND REACT
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${ENVIRONMENT:-development}
      args:
        - VITE_API_URL=/api/v1
        - VITE_ENVIRONMENT=${ENVIRONMENT}
    container_name: seele_ine_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api/v1
      - VITE_ENVIRONMENT=${ENVIRONMENT}
      - DOCKER_ENV=true
      - TZ=${TIMEZONE}
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - seele_network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://0.0.0.0:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: rebuild
          path: ./frontend/package.json

  # =============================================================================
  # NGINX REVERSE PROXY
  # =============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: seele_ine_nginx
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/sites-available:/etc/nginx/sites-available:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - seele_network
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # WORKER PARA PROCESAMIENTO ASÍNCRONO
  # =============================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: seele_ine_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ENVIRONMENT=${ENVIRONMENT}
      - TZ=${TIMEZONE}
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./temp:/app/temp
      - ./credentials:/app/credentials
      - ./logs:/app/logs
    networks:
      - seele_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r=redis.Redis(host='redis'); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # SCHEDULER PARA TAREAS PROGRAMADAS
  # =============================================================================
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: scheduler
    container_name: seele_ine_scheduler
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ENVIRONMENT=${ENVIRONMENT}
      - TZ=${TIMEZONE}
    volumes:
      - ./backend:/app
      - ./backups:/app/backups
      - ./logs:/app/logs
    networks:
      - seele_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =============================================================================
  # MONITORING CON PROMETHEUS
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: seele_ine_prometheus
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE}
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - seele_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  # =============================================================================
  # GRAFANA PARA VISUALIZACIÓN
  # =============================================================================
  grafana:
    image: grafana/grafana:10.1.0
    container_name: seele_ine_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=${TIMEZONE}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - seele_network
    depends_on:
      - prometheus
    profiles:
      - monitoring

# =============================================================================
# VOLÚMENES PERSISTENTES
# =============================================================================
volumes:
  postgres_data:
    driver: local
    name: seele_ine_postgres_data
  redis_data:
    driver: local
    name: seele_ine_redis_data
  prometheus_data:
    driver: local
    name: seele_ine_prometheus_data
  grafana_data:
    driver: local
    name: seele_ine_grafana_data

# =============================================================================
# REDES
# =============================================================================
networks:
  seele_network:
    driver: bridge
    name: seele_ine_network
    ipam:
      config:
        - subnet: 172.20.0.0/16