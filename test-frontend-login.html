<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Frontend Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .token-info { background: #f8f9fa; border: 1px solid #dee2e6; padding: 10px; margin: 10px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Frontend Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" value="admin@seele.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" value="Admin123!" required>
            </div>
            <button type="submit">Test Login</button>
        </form>
        
        <div id="result"></div>
        
        <div style="margin-top: 30px;">
            <h3>Current Tokens in Storage:</h3>
            <button onclick="showTokens()">Show Current Tokens</button>
            <button onclick="clearTokens()">Clear All Tokens</button>
            <div id="tokenInfo"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            try {
                resultDiv.innerHTML = '<div class="result">Logging in...</div>';
                
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Login failed');
                }
                
                const data = await response.json();
                
                // Convert backend snake_case to frontend camelCase (simulating frontend logic)
                const tokens = {
                    accessToken: data.tokens.access_token,
                    refreshToken: data.tokens.refresh_token,
                    tokenType: data.tokens.token_type || 'Bearer',
                    expiresIn: data.tokens.expires_in
                };
                
                // Store tokens in localStorage (simulating frontend storage)
                localStorage.setItem('seele_access_token', tokens.accessToken);
                localStorage.setItem('seele_refresh_token', tokens.refreshToken);
                localStorage.setItem('seele_token_expiration', (Date.now() + (tokens.expiresIn * 1000)).toString());
                localStorage.setItem('seele_current_user', JSON.stringify(data.user));
                
                // Validate token format
                const accessSegments = tokens.accessToken.split('.').length;
                const refreshSegments = tokens.refreshToken.split('.').length;
                
                let html = `
                    <div class="result success">
                        <h3>✅ Login Successful!</h3>
                        <p><strong>User:</strong> ${data.user.email}</p>
                        <div class="token-info">
                            <h4>Token Analysis:</h4>
                            <p><strong>Access Token:</strong></p>
                            <ul>
                                <li>Length: ${tokens.accessToken.length}</li>
                                <li>Segments: ${accessSegments} ${accessSegments === 3 ? '✅' : '❌'}</li>
                                <li>Preview: ${tokens.accessToken.substring(0, 50)}...</li>
                            </ul>
                            <p><strong>Refresh Token:</strong></p>
                            <ul>
                                <li>Length: ${tokens.refreshToken.length}</li>
                                <li>Segments: ${refreshSegments} ${refreshSegments === 3 ? '✅' : '❌'}</li>
                                <li>Preview: ${tokens.refreshToken.substring(0, 50)}...</li>
                            </ul>
                        </div>
                    </div>
                `;
                
                // Test refresh token immediately
                try {
                    const refreshResponse = await fetch(`${API_BASE}/auth/refresh`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ refresh_token: tokens.refreshToken }),
                    });
                    
                    if (refreshResponse.ok) {
                        const refreshData = await refreshResponse.json();
                        html += `
                            <div class="result success" style="margin-top: 10px;">
                                <h4>✅ Refresh Token Test Successful!</h4>
                                <p>New tokens generated successfully</p>
                            </div>
                        `;
                    } else {
                        const refreshError = await refreshResponse.json();
                        html += `
                            <div class="result error" style="margin-top: 10px;">
                                <h4>❌ Refresh Token Test Failed!</h4>
                                <p>Error: ${refreshError.detail}</p>
                            </div>
                        `;
                    }
                } catch (refreshErr) {
                    html += `
                        <div class="result error" style="margin-top: 10px;">
                            <h4>❌ Refresh Token Test Error!</h4>
                            <p>Error: ${refreshErr.message}</p>
                        </div>
                    `;
                }
                
                resultDiv.innerHTML = html;
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Login Failed!</h3>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
            }
        });
        
        function showTokens() {
            const tokenInfoDiv = document.getElementById('tokenInfo');
            const accessToken = localStorage.getItem('seele_access_token');
            const refreshToken = localStorage.getItem('seele_refresh_token');
            const expiration = localStorage.getItem('seele_token_expiration');
            const user = localStorage.getItem('seele_current_user');
            
            let html = '<div class="token-info">';
            
            if (accessToken) {
                const segments = accessToken.split('.').length;
                html += `
                    <h4>Access Token:</h4>
                    <p>Segments: ${segments} ${segments === 3 ? '✅' : '❌'}</p>
                    <p>Preview: ${accessToken.substring(0, 50)}...</p>
                `;
            } else {
                html += '<p>No access token found</p>';
            }
            
            if (refreshToken) {
                const segments = refreshToken.split('.').length;
                html += `
                    <h4>Refresh Token:</h4>
                    <p>Segments: ${segments} ${segments === 3 ? '✅' : '❌'}</p>
                    <p>Preview: ${refreshToken.substring(0, 50)}...</p>
                `;
            } else {
                html += '<p>No refresh token found</p>';
            }
            
            if (expiration) {
                const exp = new Date(parseInt(expiration));
                html += `<p><strong>Expires:</strong> ${exp.toLocaleString()}</p>`;
            }
            
            if (user) {
                const userData = JSON.parse(user);
                html += `<p><strong>User:</strong> ${userData.email}</p>`;
            }
            
            html += '</div>';
            tokenInfoDiv.innerHTML = html;
        }
        
        function clearTokens() {
            localStorage.removeItem('seele_access_token');
            localStorage.removeItem('seele_refresh_token');
            localStorage.removeItem('seele_token_expiration');
            localStorage.removeItem('seele_current_user');
            document.getElementById('tokenInfo').innerHTML = '<p>Tokens cleared!</p>';
        }
        
        // Show tokens on page load
        showTokens();
    </script>
</body>
</html>
